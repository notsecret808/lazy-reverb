name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREFOX_VERSION: '159.0'
      GECKODRIVER_VERSION: '0.37.1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-aware lint
        run: pnpm run lint
      - name: TypeScript typecheck
        run: pnpm run typecheck
      - name: Check commit messages and OpenSpec boundary
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          FALLBACK: origin/${{ github.event.repository.default_branch }}
        run: pnpm run check:commits --base "$BASE" --head "$HEAD" --fallback "$FALLBACK"
      - name: Install Firefox and GeckoDriver
        run: |
          mkdir -p dist/ci-browser
          curl --fail --silent --show-error --location --retry 3 \
            "https://archive.mozilla.org/pub/firefox/releases/$FIREFOX_VERSION/linux-x86_64/en-US/firefox-$FIREFOX_VERSION.tar.xz" \
            -o dist/ci-browser/firefox.tar.xz
          tar -xJf dist/ci-browser/firefox.tar.xz -C dist/ci-browser
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/mozilla/geckodriver/releases/download/v$GECKODRIVER_VERSION/geckodriver-v$GECKODRIVER_VERSION-linux64.tar.gz" \
            -o dist/ci-browser/geckodriver.tar.gz
          tar -xzf dist/ci-browser/geckodriver.tar.gz -C dist/ci-browser geckodriver
          dist/ci-browser/firefox/firefox --version
          dist/ci-browser/geckodriver --version
      - name: Unit, native Firefox and ZIP checks
        run: node --import tsx tools/test.ts ci --browser "$PWD/dist/ci-browser/firefox/firefox" --driver "$PWD/dist/ci-browser/geckodriver"
